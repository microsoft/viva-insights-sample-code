- slug: business-leaders-ai-usage
  name: Business Leaders AI Usage
  summary: Who is using AI, how much, and how does usage vary over time and across groups?
  demo: /examples/utility-r/business-leaders-ai-adoption.html
  source: https://github.com/microsoft/viva-insights-sample-code/blob/main/examples/utility-r/business-leaders-ai-adoption.Rmd
  requirements: https://github.com/microsoft/viva-insights-sample-code/blob/main/examples/utility-r/copilot-consumption-github-demo-reports.md#business-leaders-ai-usage
  inputs: Person, M365 Copilot, Cowork, Agent, Consumption and GitHub Copilot fixtures.
  scope: Explore four, eight or thirteen weeks by organisation, function and team. Reach counts distinct people across sources; recorded usage is per person per week across the full roster, including non-users.
  limitation: This is a synthetic reference, not a verified real-export adapter. Coverage is limited to observed usage within the Person Query roster. M365 Copilot credits and GitHub AI credits remain separate; descriptive comparisons do not establish causation.

- slug: copilot-consumption-and-ways-of-working
  name: Copilot Consumption and Ways of Working
  summary: How is Copilot consumed, and how does consumption relate to collaboration?
  image: /assets/images/reports/copilot-consumption-overview.png
  image_alt: Consumption report overview preview
  demo: /examples/utility-r/copilot-consumption-ways-of-working-simulation.html
  source: https://github.com/microsoft/viva-insights-sample-code/blob/main/examples/utility-r/copilot-consumption-ways-of-working-simulation.Rmd
  requirements: https://github.com/microsoft/viva-insights-sample-code/blob/main/examples/utility-r/copilot-consumption-github-demo-reports.md#rerun
  journey: /frontier-analytics-prompt-consumption-dashboard/
  inputs: Five fixture files across Person, Consumption and GitHub queries; GitHub breakdown files are not used.
  scope: Separate credit volume from cost per session, explore concentration and heavy-user patterns, and compare services, organisations and functions in a seven-page report.
  limitation: The real-v1 runner supports only M365 credits from Consumption activity and matching people metadata, with explicit mapping approval. Sessions, Person Query associations and GitHub panels are not implemented by that adapter. Credit intensity does not measure value or quality.

- slug: developer-experience-and-copilot
  name: Developer Experience and Copilot
  summary: What do developer working conditions and joint Copilot use look like?
  image: /assets/images/reports/github-copilot-devex-overview.png
  image_alt: Developer experience report heavy GitHub Copilot user overview preview
  demo: /examples/utility-r/github-copilot-developer-productivity-simulation.html
  source: https://github.com/microsoft/viva-insights-sample-code/blob/main/examples/utility-r/github-copilot-developer-productivity-simulation.Rmd
  requirements: https://github.com/microsoft/viva-insights-sample-code/blob/main/examples/utility-r/copilot-consumption-github-demo-reports.md#rerun
  journey: /frontier-analytics-prompt-developer-experience-dashboard/
  inputs: Person, GitHub and Consumption fixtures, including GitHub feature, model and language breakdowns.
  scope: Compare collaboration, focus, after-hours activity and network breadth across three GitHub-intensity groups. Explore joint M365 and GitHub use while keeping observation and eligibility gaps visible.
  limitation: No verified real GitHub dashboard adapter is supplied. Synthetic breakdown allocations are not verified real-export semantics. Acceptance rate is not code quality, after-hours activity is not burnout, and calendar space does not establish coding time.
