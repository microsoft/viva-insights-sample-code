name: Frontier Documentation Contracts

# Authored prompts and shared references generate the excluded content's site mirrors.

on:
  push:
    branches: [ main ]
    paths:
      - 'frontier-analytics/**'
      - '_pages/frontier-analytics-*.md'
      - '_data/**'
      - 'scripts/**'
      - '_includes/skill-catalogue.html'
      - '.github/scripts/check_prompt_drift.py'
      - '.github/workflows/prompt-drift-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontier-analytics/**'
      - '_pages/frontier-analytics-*.md'
      - '_data/**'
      - 'scripts/**'
      - '_includes/skill-catalogue.html'
      - '.github/scripts/check_prompt_drift.py'
      - '.github/workflows/prompt-drift-check.yml'

# This check only reads files in the checkout, so the GITHUB_TOKEN needs no
# write access anywhere. Restrict it to the minimum.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check generated prompt catalogue
        run: python scripts/generate_prompt_catalogue.py --check

      - name: Install documentation test requirements
        run: |
          python -m pip install -r scripts/requirements-doc-tests.txt -r scripts/requirements-recipes.txt
          python -c "import vivainsights; from importlib.metadata import version; assert version('vivainsights') == '0.4.3'"

      - name: Test documentation contracts
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
