name: Frontier Documentation Contracts

# Authored prompts and shared references generate the excluded content's site mirrors.

on:
  push:
    branches: [ main ]
    paths:
      - 'frontier-analytics/**'
      - '_pages/frontier-analytics-*.md'
      - '_data/**'
      - 'scripts/**'
      - '_includes/skill-catalogue.html'
      - '.github/scripts/check_prompt_drift.py'
      - '.github/workflows/prompt-drift-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontier-analytics/**'
      - '_pages/frontier-analytics-*.md'
      - '_data/**'
      - 'scripts/**'
      - '_includes/skill-catalogue.html'
      - '.github/scripts/check_prompt_drift.py'
      - '.github/workflows/prompt-drift-check.yml'

# This check only reads files in the checkout, so the GITHUB_TOKEN needs no
# write access anywhere. Restrict it to the minimum.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check generated prompt catalogue
        run: python scripts/generate_prompt_catalogue.py --check

      - name: Install documentation test requirements
        run: |
          python -m pip install -r scripts/requirements-doc-tests.txt -r scripts/requirements-recipes.txt
          python -c "import vivainsights; from importlib.metadata import version; assert version('vivainsights') == '0.4.3'"

      - name: Test documentation contracts
        run: python -B -m unittest discover -s scripts -p 'test_*.py'

  r-segmentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.2'
          use-public-rspm: true

      - name: Install supported segmentation dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          packages: |
            cran::vivainsights@0.7.2
            any::slider
          dependencies: 'NA'

      - name: Check R segmentation eligibility and history
        run: |
          Rscript --vanilla -e 'stopifnot(as.character(utils::packageVersion("vivainsights")) == "0.7.2")'
          Rscript --vanilla scripts/test_segmentation.R
          Rscript --vanilla scripts/test_meeting_quality.R
