# Jekyll configuration for GitHub Pages
title: "Viva Insights Sample Code Library"
description: "Sample code, tutorials, and AI prompt libraries for Microsoft Viva Insights analytics in R and Python."
baseurl: "/viva-insights-sample-code"
url: "https://microsoft.github.io"

# Privacy-focused analytics. Add host and website_id after the shared Umami
# service is deployed; the tracker remains disabled while either value is empty.
umami:
  host: "https://ca-umami-prod.lemonglacier-6a5930b7.uksouth.azurecontainerapps.io"
  website_id: "707fe1cb-2998-4b46-beba-097dcd182238"
  domains: "microsoft.github.io"

# Branding & social sharing (consumed by jekyll-seo-tag)
logo: /assets/images/apple-touch-icon.png
twitter:
  card: summary_large_image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

# Frontier prompt validation metadata (update when prompts are re-validated)
frontier:
  vivainsights_r_version: "0.7.2"
  vivainsights_py_version: "0.4.2"

# Theme
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-last-modified-at

# Navigation - Disabled default header_pages to use custom Bootstrap navigation
# header_pages:
#   - index.md
#   - essentials.md
#   - advanced.md
#   - network.md
#   - copilot.md

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections for organizing content
collections:
  examples:
    output: true
    permalink: /:collection/:name/

# Include/exclude files
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - SUPPORT.md
  - "*.Rproj"
  - .gitignore
  - frontier-analytics
